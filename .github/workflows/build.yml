name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Halo.app Payload/
          zip -qry Halo.ipa Payload
          ls -lh Halo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Halo-ipa
          path: Halo.ipa

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Halo.ipa --title "Halo (latest build)" --notes "Build ${{ github.run_number }} - $(git log -1 --pretty=%s)"
